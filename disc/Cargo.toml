[package]
name = "disc"
version = "0.1.0"
edition = "2021"
authors = ["Disc Image Studio Contributors"]
description = "Modern DSK image manipulation tool for Amstrad CPC"
license = "MIT"
repository = "https://github.com/yourusername/disc-image-studio"
readme = "README.md"
keywords = ["amstrad", "cpc", "dsk", "retro", "emulation"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo", "wrap_help"] }
clap_complete = "4.5"
clap_mangen = "0.2"
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
byteorder = "1.5"
colored = "2.1"
indicatif = "0.17"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
tempfile = "3.10"
assert_cmd = "2.0"
predicates = "3.1"

[[test]]
name = "amsdos_tests"
path = "tests/integration/amsdos_tests.rs"

[[test]]
name = "dsk_tests"
path = "tests/integration/dsk_tests.rs"

[[test]]
name = "cli_tests"
path = "tests/integration/cli_tests.rs"
