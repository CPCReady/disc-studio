[package]
name = "xcdt"
version = "1.0.0"
edition = "2021"
description = "Create and inspect Amstrad CPC CDT/TZX tape images"
license = "GPL-2.0"
authors = ["Destroyer"]

[[bin]]
name = "xcdt"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "color", "wrap_help"] }
thiserror = "1"
serde_json = "1"
